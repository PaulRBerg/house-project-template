[project]
name = "house-model-engine"
version = "0.1.0"
description = "Deterministic procedural compiler for a house concept model in Blender"
requires-python = ">=3.13"
dependencies = [
  "jsonschema==4.25.1",
  "pillow==12.3.0",
  "shapely==2.2.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-subtests==0.15.0",
  "ruff==0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]

[tool.uv]
package = false
